<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline</title>
    <link rel="icon" href="/assets/images/pwa/icon-192.png">
    <style>
        :root {
            --brand: #405189;
            --muted: #878a99;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #f3f3f9;
            color: #212529;
            font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        .panel {
            width: 100%;
            max-width: 26rem;
            background: #fff;
            border-radius: 12px;
            padding: 2.5rem 1.75rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        img {
            width: 84px;
            height: 84px;
            margin-bottom: 1.25rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.25rem;
        }

        p {
            margin: 0 0 1.75rem;
            color: var(--muted);
            font-size: 0.9375rem;
            line-height: 1.6;
        }

        button {
            width: 100%;
            min-height: 44px;
            padding: 0.75rem 1.5rem;
            border: 0;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:active {
            opacity: 0.85;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1d21;
                color: #ced4da;
            }

            .panel {
                background: #212529;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="panel">
        <img src="/assets/images/pwa/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>This page needs a connection. Check your network and try again &mdash; any page you already loaded stays available.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>

    <script>
        addEventListener('online', function () {
            location.reload();
        });
    </script>
</body>

</html>
